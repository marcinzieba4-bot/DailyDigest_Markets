name: August 2025 public metadata recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aug2025-metadata-recovery.yml'
      - 'corrections/2025-08/recovery/**'
permissions:
  contents: read
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public Google News metadata
        run: python corrections/2025-08/recovery/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: aug2025-public-metadata
          path: corrections/2025-08/recovery/output/
          retention-days: 3
          if-no-files-found: error
