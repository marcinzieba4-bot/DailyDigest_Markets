name: Part 4 frozen strategy study
on:
  workflow_dispatch:
  push:
    branches: ['research/retail-part4-nov2023']
    paths:
      - '.github/workflows/retail-part4-study.yml'
      - 'strategies/retail_part4/**/*.py'
      - 'strategies/retail_part4/protocol.json'
      - 'strategies/retail_part4/requirements.txt'
permissions:
  contents: read
env:
  SOURCE_COVERAGE_APPROVED: 'false'
  RUN_PORTFOLIO: 'false'
jobs:
  guarded-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: strategies/retail_part4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all strategy and audit source
        run: python -m compileall -q .
      - name: Verify generic collection format with invented inputs
        run: python ci/test_collection_parser.py
      - name: Check extended price campaign locally
        run: python market/fetch_prices.py --start 2023-01-01 --end 2026-11-17
      - name: Independently verify extended price coverage
        run: python -c "import json;from pathlib import Path;from ci.check_study import prices_and_metadata;print(json.dumps(prices_and_metadata(Path.cwd())[3]))"
      - name: State unresolved input gate
        if: env.SOURCE_COVERAGE_APPROVED != 'true'
        run: python -c "print('Source-coverage review is pending; preparation and portfolio execution remain gated.')"
      - name: Fetch one coherent local input snapshot
        if: env.SOURCE_COVERAGE_APPROVED == 'true'
        run: python ci/fetch_inputs.py
      - name: Prepare nine schedules and freeze exact local inputs
        if: env.SOURCE_COVERAGE_APPROVED == 'true'
        run: python prepare_study.py
      - name: Independent source input clock and code preflight
        if: env.SOURCE_COVERAGE_APPROVED == 'true'
        run: python ci/check_study.py --preflight
      - name: Execute fixed books only after explicit research GO
        if: env.SOURCE_COVERAGE_APPROVED == 'true' && env.RUN_PORTFOLIO == 'true'
        shell: bash
        run: |
          study_freeze_sha=$(python -c "import hashlib;from pathlib import Path;print(hashlib.sha256(Path('research_freeze.json').read_bytes()).hexdigest())")
          python run_study.py --execute --expected-freeze "$study_freeze_sha"
      - name: Independent physical ledger and recovery verification
        if: env.SOURCE_COVERAGE_APPROVED == 'true' && env.RUN_PORTFOLIO == 'true'
        run: python ci/check_study.py --ledger
      - name: Render main November PnL and reconcile all nine cases
        if: env.SOURCE_COVERAGE_APPROVED == 'true' && env.RUN_PORTFOLIO == 'true'
        run: python plot_results.py --expected-cases 9 --main-corpus november_continuous --audit-json diagnosis/independent_results.json
      - name: Export only approved simulated results and charts
        if: env.SOURCE_COVERAGE_APPROVED == 'true' && env.RUN_PORTFOLIO == 'true'
        run: python ci/export_approved_results.py --log-transport
      - uses: actions/upload-artifact@v4
        if: env.SOURCE_COVERAGE_APPROVED == 'true' && env.RUN_PORTFOLIO == 'true'
        with:
          name: retail-part4-simulated-results-${{ github.run_id }}
          path: |
            strategies/retail_part4/approved_outputs/
            strategies/retail_part4/retail_part4_simulated_results.zip
          if-no-files-found: error
          retention-days: 90
