name: mapp_strategy extended history
on:
  workflow_dispatch:
  push:
    branches: ['research/mapp-2022-month-gaps']
    paths:
      - '.github/workflows/mapp-extended-history.yml'
      - 'strategies/mapp_strategy/ci/run_extended_history.py'
      - 'strategies/mapp_strategy/ci/extended_input_audit.py'
      - 'strategies/mapp_strategy/ci/extended_outputs.py'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: strategies/mapp_strategy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile extended-history code
        run: python -m compileall -q .
      - name: Simulate fixed strategies with explicit missing-month policy
        run: python ci/run_extended_history.py --root . --start 2022-01-01 --end 2026-11-20 --workers 12
      - uses: actions/upload-artifact@v4
        with:
          name: mapp_strategy_extended_2022_2026
          path: |
            strategies/mapp_strategy/publication/
            strategies/mapp_strategy/mapp_strategy_extended_simulated_results.zip
          if-no-files-found: error
          retention-days: 90
