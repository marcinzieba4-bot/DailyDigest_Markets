name: Part 4 source and price preflight diagnostics
on:
  workflow_dispatch:
  push:
    branches: ['research/retail-part4-nov2023']
    paths:
      - '.github/workflows/retail-part4-raw.yml'
      - 'strategies/retail_part4/source_tools/fetch_public_sources.py'
      - 'strategies/retail_part4/market/fetch_prices.py'
permissions:
  contents: read
jobs:
  public-input-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: strategies/retail_part4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile published source
        run: python -m compileall -q .
      - name: Diagnose historical source extraction
        id: sources
        continue-on-error: true
        run: python source_tools/fetch_public_sources.py --start 2023-11-01 --end 2026-10-30
      - name: Validate price campaign independently
        id: prices
        if: always()
        continue-on-error: true
        run: python market/fetch_prices.py --start 2023-01-01 --end 2026-10-30
      - name: Keep source or price failures visible
        if: ${{ steps.sources.outcome != 'success' || steps.prices.outcome != 'success' }}
        run: exit 1
