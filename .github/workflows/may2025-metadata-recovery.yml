name: May 2025 public metadata recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/may2025-metadata-recovery.yml'
      - 'corrections/2025-05/recovery/**'
permissions:
  contents: read
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/workflows/may2025-metadata-recovery.yml
            corrections/2025-05/recovery/input.json
            corrections/2025-05/recovery/resolve_news_url.py
            corrections/2025-05/recovery/run.py
          sparse-checkout-cone-mode: false
      - name: Resolve public Google News metadata
        run: python corrections/2025-05/recovery/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: may2025-public-metadata
          path: corrections/2025-05/recovery/output/
          retention-days: 3
          if-no-files-found: error
