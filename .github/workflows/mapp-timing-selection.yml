name: mapp_strategy timing versus selection
on:
  workflow_dispatch:
  push:
    branches: ['research/mapp-timing-selection']
    paths:
      - '.github/workflows/mapp-timing-selection.yml'
      - 'strategies/mapp_strategy/ci/analyze_timing_selection.py'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: strategies/mapp_strategy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile analysis
        run: python -m py_compile ci/analyze_timing_selection.py
      - name: Compare saved signals with SPY and random timing
        run: python ci/analyze_timing_selection.py --archive backtests/2022_2026_month_gaps/mapp_strategy_extended_simulated_results.zip --out timing_selection_outputs --stream-figure
      - uses: actions/upload-artifact@v4
        with:
          name: mapp_strategy_timing_selection
          path: strategies/mapp_strategy/timing_selection_outputs/
          if-no-files-found: error
          retention-days: 90
