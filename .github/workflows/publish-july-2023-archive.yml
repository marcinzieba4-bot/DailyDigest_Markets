name: Publish July 2023 archive
on:
  push:
    branches:
      - codex/jul-2023-research-companion
    paths:
      - corrections/2023-07/release/objects.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-july-2023-retrospective
  cancel-in-progress: false
jobs:
  locate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      production: ${{ steps.release.outputs.production }}
      visible: ${{ steps.release.outputs.visible }}
    steps:
      - name: Inspect public archive and registered deployment environments
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, re, urllib.request
          from html.parser import HTMLParser
          class Archive(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.links.add(dict(attrs).get("href", ""))
          expected = {"archive/2023-07-"+d+".html" for d in ("03","04","05","06","07","10","11","12","13","14","17","18","19","20","21","24","25","26","27","28","31")}
          seen = set()
          req = urllib.request.Request("https://zembihf.xyz/reports/index.html", headers={"User-Agent":"DailyDigest-Archive-Verification/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  archive = Archive()
                  archive.feed(response.read().decode())
                  seen = expected & archive.links
              print("Public archive currently lists",len(seen),"of 21 July weekday links.")
          except OSError as exc:
              print("Public archive could not be checked:",type(exc).__name__)
          endpoint = os.environ["GITHUB_API_URL"]+"/repos/"+os.environ["GITHUB_REPOSITORY"]+"/environments?per_page=100"
          req = urllib.request.Request(endpoint,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          known=[]
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  known = [obj["name"] for obj in json.load(response).get("environments",[])]
          except OSError as exc:
              print("Registered deployment environment metadata:",type(exc).__name__,getattr(exc,"code","unavailable"))
          candidates = [n for n in known if n.lower() in {"zembihf.xyz","production","prod","reports-production","production-reports","zembihf-production"}]
          exact = [n for n in candidates if n.lower()=="zembihf.xyz"]
          target = exact[0] if len(exact)==1 else candidates[0] if len(candidates)==1 else ""
          print("Registered deployment environments:",len(known),"; unambiguous matching production environment:",bool(target))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("production="+target,file=f)
              print("visible="+str(len(seen)==21).lower(),file=f)
  verify_existing:
    needs: locate
    if: needs.locate.outputs.visible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install 'boto3>=1.36,<2' 'beautifulsoup4>=4.12,<5' 'playwright>=1.50,<2'
      - run: python corrections/2023-07/tools/publish_weekdays.py --verify-public --browser
  publish:
    needs: locate
    if: needs.locate.outputs.visible != 'true' && needs.locate.outputs.production != ''
    environment:
      name: ${{ needs.locate.outputs.production }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install archive verification tools
        run: python -m pip install 'boto3>=1.36,<2' 'beautifulsoup4>=4.12,<5' 'playwright>=1.50,<2'
      - name: Check all 21 editions
        run: python corrections/2023-07/tools/publish_weekdays.py --check
      - name: Select existing repository deployment credentials
        id: identity
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_KEY }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET }}
        shell: bash
        run: |
          if [[ -n "$ROLE" ]]; then
            echo 'method=role' >> "$GITHUB_OUTPUT"
          elif [[ -n "$KEY" && -n "$SECRET" ]]; then
            echo 'method=keys' >> "$GITHUB_OUTPUT"
          else
            echo '::error::No AWS publishing identity is configured for the selected production environment.'
            exit 1
          fi
      - name: Assume the configured publishing role
        if: steps.identity.outputs.method == 'role'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: july-2023-archive
          aws-region: eu-north-1
      - name: Load the configured publishing credentials
        if: steps.identity.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
      - name: Publish the dated archive and verify production
        run: python corrections/2023-07/tools/publish_weekdays.py --publish --verify-public --browser
  unavailable:
    needs: locate
    if: needs.locate.outputs.visible != 'true' && needs.locate.outputs.production == ''
    runs-on: ubuntu-latest
    steps:
      - name: Record unavailable publication route
        run: |
          echo '::error::The archive is incomplete and no existing production environment was identified. The repository-level publishing identity was checked in the previous run.'
          exit 1
