name: Read-only archive access recovery probe
on:
  pull_request:
    branches: [codex/october-2025-retrospective]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/sep-source-recovery.yml, 'recovery/sep2025/**']
permissions:
  contents: read
jobs:
  read-only-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: recovery/sep2025
      - name: Read-only public health and existing deployment-identity presence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_SECRET: ${{ secrets.AWS_SECRET }}
          AWS_PASS: ${{ secrets.AWS_PASS }}
        run: python recovery/sep2025/access_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-access-probe
          retention-days: 2
          path: recovery/sep2025/access_probe.json
