name: Retrospective retail cited source date verification
on:
  pull_request:
    branches: [codex/october-2025-retrospective]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/sep-source-recovery.yml, 'recovery/sep2025/**']
permissions:
  contents: read
concurrency:
  group: sep-2025-public-data-recovery
  cancel-in-progress: true
jobs:
  public-cited-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: recovery/sep2025
      - name: Verify cited original publisher dates
        run: python recovery/sep2025/posthoc/review_cited_urls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-cited-url-audit
          retention-days: 2
          path: recovery/sep2025/cited_url_results.json
