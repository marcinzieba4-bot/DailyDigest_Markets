name: Protected latest and index body verification
on:
  pull_request:
    branches: [codex/october-2025-retrospective]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/sep-source-recovery.yml, 'recovery/sep2025/**']
permissions:
  contents: read
jobs:
  protected-public-specials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea8b0413835962ba682fde292fa71375d1b85747
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            corrections/retail-quality/audit/protected_specials.json
          persist-credentials: false
      - name: Compare latest and index public bytes with original snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures as cf
          import datetime as dt
          import hashlib,json,subprocess,time,urllib.request
          expected_commit="ea8b0413835962ba682fde292fa71375d1b85747"
          actual_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert actual_commit==expected_commit
          source=Path("corrections/retail-quality/audit/protected_specials.json")
          expected=json.loads(source.read_text())
          assert set(expected)=={"reports/latest.html","reports/index.html"}
          started=dt.datetime.now(dt.timezone.utc).isoformat()
          def verify(pair):
            key,item=pair
            result={"key":key,"expected_sha256":item["sha256"],"expected_bytes":item["bytes"],"passed":False}
            for attempt in range(1,6):
              try:
                req=urllib.request.Request("https://d7g7nkeytae81.cloudfront.net/"+key,headers={"User-Agent":"DailyDigest-public-special-preservation/1.0","Accept-Encoding":"identity"})
                with urllib.request.urlopen(req,timeout=25) as response:
                  blob=response.read()
                  status=response.status
                digest=hashlib.sha256(blob).hexdigest()
                result.update(status=status,sha256=digest,bytes=len(blob),actual_sha256=digest,actual_bytes=len(blob),attempts=attempt,passed=status==200 and digest==item["sha256"] and len(blob)==item["bytes"],observed_at_utc=dt.datetime.now(dt.timezone.utc).isoformat())
                return result
              except Exception as error:
                result.update(error_type=type(error).__name__,status=getattr(error,"code",None),attempts=attempt)
                if attempt<5:time.sleep(min(2**(attempt-1),8))
            return result
          with cf.ThreadPoolExecutor(max_workers=2) as pool:
            rows=list(pool.map(verify,sorted(expected.items())))
          passed=sum(row["passed"] for row in rows)
          output={"purpose":"Independent public full-body SHA preservation proof for the exact latest and archive-index objects; no AWS credentials or writes.","source_commit":actual_commit,"source_specials_sha256":hashlib.sha256(source.read_bytes()).hexdigest(),"started_at_utc":started,"finished_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),"expected_count":2,"checked_count":len(rows),"passed_count":passed,"failed_count":len(rows)-passed,"passed":passed==2,"aws_credentials_used":False,"aws_writes":False,"rows":rows}
          Path("protected-specials.json").write_text(json.dumps(output,indent=2))
          print(json.dumps({k:v for k,v in output.items() if k!="rows"}))
          raise SystemExit(0 if passed==2 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-public-specials-sha
          retention-days: 2
          path: protected-specials.json
