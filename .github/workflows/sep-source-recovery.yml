name: September 2025 public data recovery
on:
  pull_request:
    branches: [codex/october-2025-retrospective]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sep-source-recovery.yml
      - recovery/sep2025/**
permissions:
  contents: read
concurrency:
  group: sep-2025-public-data-recovery
  cancel-in-progress: true
jobs:
  public-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: recovery/sep2025
      - name: Harvest dated public RSS sources
        run: python recovery/sep2025/tools/fetch_news.py --workers 6
      - name: Screen 2025-09-05 original publisher dates
        run: python recovery/sep2025/tools/ready_feeds.py 2025-09-05 --from-unreviewed --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: sep2025-inputs-2025-09-05
          retention-days: 2
          compression-level: 0
          path: |
            recovery/sep2025/feeds/2025-09-05.json.gz
            recovery/sep2025/audit/news_ready_2025-09-05.json
            recovery/sep2025/audit/canonical_reuters_urls.json
